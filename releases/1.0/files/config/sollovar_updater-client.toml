[general]
	#Текущая версия модпака
	modpackVersion = "1.0"
	#URL адрес сервера для проверки обновлений (JSON манифест)
	updateServerUrl = "https://raw.githubusercontent.com/So1lovar/Book-Of-Minecraft/main/modpack_manifest.json"
	#Интервал автоматической проверки обновлений (в минутах)
	# Default: 30
	# Range: 1 ~ 1440
	checkIntervalMinutes = 30
	#Проверять обновления при запуске игры
	autoCheckOnStartup = true
